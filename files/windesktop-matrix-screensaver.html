<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>matrix</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; width: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Local, self-contained matrix-rain page for the WindowsDesktop/WindowsDesktopCpp !matrix
// test — Windows equivalent of NvidiaNano's file:///home/tunastreet/matrix-screensaver.html.
// No external requests; loaded via a file:// URL by the launch script.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const chars = "アイウエオカキクケコサシスセソタチツテト0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 18;
let columns, drops;

function initDrops() {
  columns = Math.floor(canvas.width / fontSize);
  drops = new Array(columns).fill(1);
}
initDrops();
window.addEventListener('resize', initDrops);

function draw() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#0F0";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}

setInterval(draw, 40);
</script>
</body>
</html>
